name: Android APK Build

# Iska matlab hai ki jab bhi aap code badlenge ya manual button dabayenge, app build hoga
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Isse GitHub par "Run workflow" ka manually button mil jata hai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub aapke saare code ko runner machine par download karega
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Android app build karne ke liye Java install karega
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Android SDK aur Gradle build script ko permissions dega
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 🔥 NAYA AUTOMATED STEP: Jar file missing hone ka error theek karne ke liye
    - name: Download Missing Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://githubusercontent.com

    # 4. Yeh command aapke code se final APK file banayegi
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Build hone ke baad APK file ko download karne ke liye screen par show karega
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-floating-widget-app
        path: app/build/outputs/apk/debug/app-debug.apk
